function riskColor(score) {
  // 0 -> green, 0.5 -> yellow, 1 -> red
  const stops = [
    [0.45, [46, 125, 50]],
    [0.49, [249, 168, 37]],
    [0.54, [198, 40, 40]],
  ];
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (score >= stops[i][0] && score <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  }
  const t = (b[0] - a[0]) === 0 ? 0 : (score - a[0]) / (b[0] - a[0]);
  const c = a[1].map((v, i) => Math.round(v + t * (b[1][i] - v)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
  maxZoom: 16,
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 45,
  iconCreateFunction: function (cluster) {
    const markers = cluster.getAllChildMarkers();
    const avg = markers.reduce((s, m) => s + m.options.riskScore, 0) / markers.length;
    const color = riskColor(avg);
    const size = markers.length < 10 ? 32 : markers.length < 50 ? 40 : 48;
    return L.divIcon({
      html: `<div class="cluster-icon" style="width:${size}px;height:${size}px;background:${color};">${markers.length}</div>`,
      className: '', iconSize: [size, size],
    });
  },
});

BRIDGE_DATA.forEach(function (d) {
  const marker = L.circleMarker([d.lat, d.lon], {
    radius: 7,
    color: '#222',
    weight: 1,
    fillColor: riskColor(d.score),
    fillOpacity: 0.9,
    riskScore: d.score,
  });

  const yearText = d.year ? d.year : 'unknown';
  const html = `
    <div class="risk-popup">
      <h3>${d.state} ${d.struct}</h3>
      <table>
        <tr><td class="label">Feature crossed</td><td>${d.feature || '—'}</td></tr>
        <tr><td class="label">Facility carried</td><td>${d.facility || '—'}</td></tr>
        <tr><td class="label">Material</td><td>${d.material}</td></tr>
        <tr><td class="label">Year built</td><td>${yearText}</td></tr>
        <tr><td class="label">Risk score</td><td><span class="risk-badge" style="background:${riskColor(d.score)}">${d.score.toFixed(2)}</span></td></tr>
        <tr><td class="label">Nationwide rank</td><td>#${d.rank.toLocaleString()} of 434,812</td></tr>
      </table>
    </div>`;
  marker.bindPopup(html);
  clusterGroup.addLayer(marker);
});

map.addLayer(clusterGroup);
